services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: qarar
      POSTGRES_USER: qarar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["55432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U qarar"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://qarar:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/qarar
      QARAR_API_KEYS_JSON: ${QARAR_API_KEYS_JSON:?Set QARAR_API_KEYS_JSON}
    ports: ["8000:8000"]
    volumes: ["./backend/data:/app/data"]
    depends_on:
      db:
        condition: service_healthy

  mcp:
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://qarar:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/qarar
      QARAR_API_KEYS_JSON: ${QARAR_API_KEYS_JSON:?Set QARAR_API_KEYS_JSON}
    command: ["python","-m","uvicorn","app.mcp_server:app","--host","0.0.0.0","--port","8001"]
    ports: ["8001:8001"]
    volumes: ["./backend/data:/app/data"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      QARAR_BACKEND_URL: http://api:8000/api
      QARAR_DEV_AUTO_LOGIN_KEY: ${QARAR_DEV_AUTO_LOGIN_KEY:-}
    ports: ["3000:3000"]
    depends_on: [api]

  clamav:
    image: clamav/clamav:stable
    profiles: ["security"]
    ports: ["3310:3310"]
    volumes: ["clamav_data:/var/lib/clamav"]

  n8n:
    image: n8nio/n8n:2.0.3
    profiles: ["automation"]
    environment:
      N8N_SECURE_COOKIE: "false"
    ports: ["5678:5678"]
    volumes: ["n8n_data:/home/node/.n8n"]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["platform"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-qarar}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports: ["9000:9000","9001:9001"]
    volumes: ["minio_data:/data"]

  redis:
    image: redis:7.4-alpine
    profiles: ["platform"]
    ports: ["6379:6379"]

volumes:
  pg_data: {}
  minio_data: {}
  n8n_data: {}
  clamav_data: {}
