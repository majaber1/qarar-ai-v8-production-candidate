name: Qarar CI

on:
  push:
    branches: [main, codex/accelerator-readiness, codex/v9-decision-provenance]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Run backend tests
        run: python -m pytest -q
      - name: Verify migrations reach head
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
          ENVIRONMENT: test
        run: |
          python -m alembic upgrade head
          python -m alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run bilingual responsive smoke E2E
        run: npm run test:e2e:smoke
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  compose-config:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-compose-validation-only
      MINIO_ROOT_PASSWORD: ci-compose-validation-only
      QARAR_API_KEYS_JSON: '{"ci-validation-key":{"tenant_id":"ci","subject":"ci","roles":["admin"]}}'
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose definition
        run: docker compose config --quiet
